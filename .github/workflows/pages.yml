name: Publish RSS feeds to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "**"
      - "!README.md"
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run every hour:
    - cron: "0 * * * *"
  workflow_dispatch:

env:
  CI: true
jobs:
  publish-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TWITTER_ACCOUNT_PASSWORD: ${{ secrets.TWITTER_ACCOUNT_PASSWORD }}
      TWITTER_COOKIE_VALUE: ${{ secrets.TWITTER_COOKIE_VALUE }}
    steps:
      - uses: actions/checkout@v4
      - run: npx playwright install firefox --with-deps
      - uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npx feed-me-up-scotty
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          # trunk-ignore(yamllint/quoted-strings)
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: playwright install firefox --with-deps
      # Check the generated XML files from feed-me-up-scotty (at least 1 entry)
      - name: Check generated XML feeds
        run: python check_feeds.py
      - name: Restore tw_session cache
        id: cache-tw-session
        uses: actions/cache@v3
        with:
          path: ./SESSION.tw_session
          key: SESSION.tw_session
      - name: Run twitter.py
        # Never fail the job: the tweet feed is one source among others.
        # The exit code is recorded for the watchdog instead of being masked.
        id: twitter
        run: |
          rc=0
          python twitter.py || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            echo "::warning::twitter.py failed with rc=$rc (deploy continues; twitter watchdog will alert)"
          fi
      - name: Save updated tw_session cache
        if: always()
        uses: actions/cache@v3
        with:
          path: ./SESSION.tw_session
          key: SESSION.tw_session
          restore-keys: |
            tw-session-
      - name: Record twitter feed status
        if: always()
        run: |
          mkdir -p public
          git fetch -q "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" gh-pages || true
          git show FETCH_HEAD:tweets-status.json > prev_status.json 2>/dev/null || echo '{"history":[]}' > prev_status.json
          RC='${{ steps.twitter.outputs.rc }}'
          python3 - "${RC:-missing}" <<'PY'
          import datetime, json, os, sys
          try:
              rc = int(sys.argv[1])
          except ValueError:
              rc = None  # step was skipped or produced no rc
          try:
              hist = json.load(open("prev_status.json")).get("history", [])
          except Exception:
              hist = []
          hist = hist[-47:]
          ts = datetime.datetime.now(datetime.timezone.utc).isoformat()
          hist.append({
              "run_id": os.environ["GITHUB_RUN_ID"],
              "ts": ts,
              "rc": rc,
          })
          run_url = "{}/{}/actions/runs/{}".format(
              os.environ["GITHUB_SERVER_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]
          )
          out = {"updated_at": ts, "run_id": os.environ["GITHUB_RUN_ID"], "run_url": run_url, "last_rc": rc, "history": hist}
          json.dump(out, open("public/tweets-status.json", "w"), indent=1)
          print("recorded twitter status rc={} for run {}".format(rc, os.environ["GITHUB_RUN_ID"]))
          PY
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Deploy to GitHub Pages
        run: |
          git config user.name $GITHUB_ACTOR
          git config user.email $GITHUB_ACTOR@users.noreply.github.com
          git remote add gh-pages-remote https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git
          git fetch --no-recurse-submodules
          git worktree add ./gh-pages gh-pages
          cd gh-pages
          git rm -r .
          cp -r ../public/. .
          git add .
          git commit --message="Deploying to GitHub Pages from $GITHUB_SHA"
          git push gh-pages-remote gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
